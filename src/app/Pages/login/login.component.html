
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0d6efd, #6f42c1);
            overflow: hidden;
        }

        .login-wrapper {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .login-card {

            width: 100%;
            max-width: 1050px;
            border-radius: 25px;
            overflow: hidden;

            background: rgba(255, 255, 255, .15);
            backdrop-filter: blur(20px);

            box-shadow: 0 20px 50px rgba(0, 0, 0, .25);

            animation: slideUp .8s ease;
        }

        @keyframes slideUp {

            from {
                opacity: 0;
                transform: translateY(50px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        .left-panel {

            background: linear-gradient(150deg, #0d6efd, #6610f2);

            color: white;

            padding: 70px 50px;

            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .left-panel h1 {

            font-size: 42px;
            font-weight: 700;
        }

        .left-panel p {

            opacity: .9;
            margin-top: 15px;
            line-height: 1.8;
        }

        .illustration {

            font-size: 90px;
            margin-bottom: 25px;

            animation: float 3s infinite;
        }

        @keyframes float {

            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }

            100% {
                transform: translateY(0);
            }
        }

        .right-panel {

            background: white;
            padding: 60px;
        }

        .login-title {

            font-weight: 700;
        }

        .form-floating>.form-control {

            border-radius: 12px;
        }

        .form-control {

            transition: .3s;
        }

        .form-control:focus {

            border-color: #0d6efd;
            box-shadow: 0 0 0 .2rem rgba(13, 110, 253, .15);
            transform: scale(1.01);
        }

        .btn-login {

            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            transition: .3s;
        }

        .btn-login:hover {

            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(13, 110, 253, .25);
        }

        .social-btn {

            border-radius: 10px;
            transition: .3s;
        }

        .social-btn:hover {

            transform: translateY(-3px);
        }

        a {
            text-decoration: none;
        }

        @media(max-width:768px) {

            .left-panel {
                display: none;
            }

            .right-panel {
                padding: 40px 30px;
            }

        }
    </style>

</head>

<body>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="row g-0">
                <div class="col-lg-5">
                    <div class="left-panel h-100">
                        <div class="illustration">
                            <i class="bi bi-shield-lock-fill"></i>
                        </div>
                        <h1>Welcome Back</h1>
                        <p class="text-center">
                            Login to your Enquiry Management Portal and manage customer enquiries,
                            follow-ups and leads efficiently.
                        </p>
                    </div>
                </div>

                <div class="col-lg-7">
                    <div class="right-panel">
                        <h2 class="login-title mb-2">
                            Sign In
                        </h2>
                        <p class="text-muted mb-4">
                            Enter your credentials to continue.
                        </p>

                        <form>
                            <div class="form-floating mb-4">
                                <input type="email" class="form-control" id="email" placeholder="Email"
                                    [(ngModel)]="loginObj.userName" name="userName">
                                <label for="email">
                                    <i class="bi bi-envelope-fill"></i>
                                    Email Address
                                </label>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="password" class="form-control" id="password" placeholder="Password"
                                    [(ngModel)]="loginObj.password" name="password">

                                <label for="password">
                                    <i class="bi bi-lock-fill"></i>
                                    Password
                                </label>

                            </div>

                            <div class="d-flex justify-content-between mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="remember">
                                    <label class="form-check-label" for="remember">
                                        Remember Me
                                    </label>
                                </div>

                                <a href="#">
                                    Forgot Password
                                </a>

                            </div>

                            <button class="btn btn-primary btn-login w-100" (click)="onLogin()">
                                <i class="bi bi-box-arrow-in-right"></i> Login
                            </button>

                            <hr class="my-4">
                            <div class="text-center text-muted mb-3">or continue with </div>
                                
                            <div class="row g-3">
                                <div class="col">
                                    <button class="btn btn-outline-danger social-btn w-100">
                                        <i class="bi bi-google"></i> Google </button>
                                 </div>

                                <div class="col">
                                    <button class="btn btn-outline-primary social-btn w-100">
                                        <i class="bi bi-facebook"></i> Facebook
                                    </button>
                                </div>
                            </div>

                            <div class="text-center mt-4">
                                Don't have an account?
                                <a href="#"> Create Account </a>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
