<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  .overlay {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    background: rgba(0, 0, 0, .5);

    display: flex;

    justify-content: center;

    align-items: center;

    z-index: 99999;

  }


  .confirm-box {

    width: 350px;

    background: white;

    padding: 30px;

    border-radius: 12px;

    text-align: center;

    animation: popup .3s ease;

  }


  .icon {

    font-size: 50px;

  }


  .buttons {

    display: flex;

    justify-content: center;

    gap: 15px;

    margin-top: 25px;

  }


  button {

    padding: 10px 25px;

    border: none;

    border-radius: 5px;

    cursor: pointer;

    font-size: 15px;

  }


  .cancel {

    background: #6c757d;

    color: white;

  }


  .delete {

    background: #dc3545;

    color: white;

  }


  @keyframes popup {

    from {

      transform: scale(.5);

      opacity: 0;

    }

    to {

      transform: scale(1);

      opacity: 1;

    }

  }
</style>

<body>
  <div class="overlay" *ngIf="show">


    <div class="confirm-box">


      <div class="icon">
        ⚠️
      </div>


      <h2>Confirm Delete</h2>


      <p>
        {{message}}
      </p>


      <div class="buttons">

         <button class="delete" (click)="confirm()">

         Yes

        </button>

        <button class="cancel" (click)="cancel()">

          No

        </button>
      </div>


    </div>


  </div>
</body>

</html>
